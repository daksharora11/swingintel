# Pings the Render backend every 5 minutes so the free tier does not go to sleep.
# Setup: repo Settings > Secrets and variables > Actions > Variables tab >
# New repository variable named BACKEND_URL, e.g. https://swingintel-backend.onrender.com
# GitHub may delay or skip scheduled runs under load, so this is best effort.
name: keepalive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then echo "BACKEND_URL variable is not set, skipping"; exit 0; fi
          curl -fsS --max-time 90 --retry 2 --retry-delay 5 "${BACKEND_URL%/}/api/health"
