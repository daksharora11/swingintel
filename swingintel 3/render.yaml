# Render Blueprint — lets Render auto-configure the backend service when you
# connect this repo via "New +" > "Blueprint". If Render doesn't pick this
# up automatically, the README has the equivalent manual dashboard steps.
services:
  - type: web
    name: swingintel-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NEWSAPI_KEY
        sync: false
